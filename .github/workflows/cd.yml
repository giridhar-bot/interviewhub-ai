# ══════════════════════════════════════════════════════════════
# InterviewHub AI — CD Pipeline
# Auto-deploy to Vercel on merge to main/staging/develop
# ══════════════════════════════════════════════════════════════

name: CD

on:
  push:
    branches: [main, staging, develop]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  # ─── Deploy to Vercel ──────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || github.ref_name }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Validate Vercel credentials
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Configure the VERCEL_TOKEN GitHub Actions secret."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Link Vercel Project
        run: vercel link --yes --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        run: |
          URL=$(vercel deploy --yes ${{ github.ref_name == 'main' && '--prod' || '' }} --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  # ─── Database Migration ────────────────────
  migrate:
    name: Database Migration
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref_name == 'main' || github.ref_name == 'staging'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma Migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # ─── Post-Deploy Health Check ──────────────
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Check health endpoint
        env:
          DEPLOY_URL: ${{ needs.deploy.outputs.url }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::Deploy did not return a deployment URL."
            exit 1
          fi
          STATUS=$(curl --show-error --silent --max-time 30 -o /dev/null -w "%{http_code}" "$DEPLOY_URL/api/health")
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed with status $STATUS"
            exit 1
          fi
          echo "Health check passed!"

  # ─── Notify ────────────────────────────────
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy, health-check]
    if: always()
    steps:
      - name: Deployment Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** ${{ needs.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ needs.health-check.result }}" >> $GITHUB_STEP_SUMMARY
